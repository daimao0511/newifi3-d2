name: build-newifi-d2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'files/**'
      - '.github/workflows/build.yml'

env:
  OWRT_VER: '25.12.6'
  TARGET: 'ramips'
  SUBTARGET: 'mt7621'
  PROFILE: 'd-team_newifi-d2'
  SDK: 'openwrt-sdk-25.12.6-ramips-mt7621_gcc-14.3.0_musl.Linux-x86_64'
  VLMCSD_REPO: 'https://github.com/Wind4/vlmcsd.git'
  # 固定到 tag svn1113 的 commit，不跟 master 飘
  VLMCSD_COMMIT: 'e599080486478e219cd065e141d6de050a450c27'
  PKGS: >-
    luci-ssl
    luci-i18n-base-zh-cn luci-i18n-firewall-zh-cn luci-i18n-package-manager-zh-cn
    curl ca-bundle
    openssh-sftp-server
    sqm-scripts luci-app-sqm luci-i18n-sqm-zh-cn
    tc-tiny ip-tiny kmod-sched-cake kmod-ifb iptables-nft iptables-mod-ipopt
    -wpad-basic-mbedtls
    -kmod-mt7603 -kmod-mt76x2 -kmod-mac80211 -kmod-cfg80211
    -kmod-usb3 -kmod-usb-ledtrig-usbport
    -ppp -ppp-mod-pppoe
    -odhcp6c -odhcpd-ipv6only

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd wget curl file python3 ca-certificates

      - name: 预检 —— 脚本语法 / 权限位 / 换行符
        run: |
          set -e
          for f in files/etc/uci-defaults/99-newifi-custom \
                   files/etc/init.d/vlmcsd \
                   files/etc/init.d/proxy-mipsle; do
            sh -n "$f"; echo "语法 OK: $f"
            test -x "$f" || { echo "!! $f 缺可执行位"; exit 1; }
            if grep -q $'\r' "$f"; then echo "!! $f 含 CRLF"; exit 1; fi
          done
          if [ -e files/etc/vlmcsd.kmd ]; then
            echo "!! 不该再有 vlmcsd.kmd（KMS 数据已内嵌）"; exit 1
          fi
          # argon 主题是「模板 .ut + ucode 模块 + 前端 JS + rpcd」四件套，
          # 少任何一层编译期都发现不了，刷完才炸（吃过两次：palette 缺失 → web 500，
          # menu-argon.js 缺失 → 左侧菜单整块空白）。这里做静态闭合检查。
          for ut in $(find files -name '*.ut'); do
            for m in $(grep -oE "from 'luci\.[a-z0-9_-]+'" "$ut" | sed "s/from 'luci\.//; s/'//" | sort -u); do
              case "$m" in
                core|util|sys|fs|ip|jsonc|debug|http|template|luci) continue ;;
              esac
              test -f "files/usr/share/ucode/luci/$m.uc" \
                || { echo "!! $ut 引用 luci.$m，但缺 files/usr/share/ucode/luci/$m.uc"; exit 1; }
              echo "模板 OK: $ut -> luci.$m"
            done
            for j in $(grep -oE "L\.require\('(menu-)?argon[a-z-]*'\)" "$ut" | sed "s/L\.require('//; s/')//" | sort -u); do
              test -f "files/www/luci-static/resources/$j.js" \
                || { echo "!! $ut 引用 $j，但缺 files/www/luci-static/resources/$j.js"; exit 1; }
              echo "模板 OK: $ut -> $j.js"
            done
          done

      - name: 下载 OpenWrt SDK（要里面的 musl 交叉工具链）
        run: |
          set -euxo pipefail
          exec > >(tee -a /tmp/build.log) 2>&1
          URL="https://downloads.openwrt.org/releases/${OWRT_VER}/targets/${TARGET}/${SUBTARGET}/${SDK}.tar.zst"
          echo "GET $URL"
          wget -q "$URL"
          tar --zstd -xf "${SDK}.tar.zst"
          ls -d "${SDK}"/staging_dir/*/

      - name: 交叉编译 vlmcsd（KMS 激活服务）
        run: |
          set -euxo pipefail
          exec > >(tee -a /tmp/build.log) 2>&1

          TOOLCHAIN=$(find "${SDK}/staging_dir" -maxdepth 1 -type d -name 'toolchain-*' | head -1)
          test -n "$TOOLCHAIN"
          # 后面要 cd 到源码目录，工具链必须用绝对路径，否则 exec 时找不到文件
          TOOLCHAIN=$(realpath "$TOOLCHAIN")
          CC=$(ls "$TOOLCHAIN"/bin/*-openwrt-linux-musl-gcc | head -1)
          echo "TOOLCHAIN=$TOOLCHAIN"
          echo "CC=$CC"
          "$CC" -dumpmachine
          "$CC" -v 2>&1 | grep -E '^Target:|^gcc version' || true

          # 上游源码，按 tag 拉，落到固定 commit 才继续
          rm -rf /tmp/vlmcsd-src && mkdir -p /tmp/vlmcsd-src
          git -C /tmp/vlmcsd-src init -q
          git -C /tmp/vlmcsd-src remote add origin "$VLMCSD_REPO"
          git -C /tmp/vlmcsd-src fetch -q --depth 1 origin refs/tags/svn1113
          git -C /tmp/vlmcsd-src checkout -q FETCH_HEAD
          test "$(git -C /tmp/vlmcsd-src rev-parse HEAD)" = "$VLMCSD_COMMIT"
          git -C /tmp/vlmcsd-src log --oneline -1

          # 不用它的 GNUmakefile（BSD make 语法，GNU make 进去会去调 gmake）：
          # 直接列源码调交叉 gcc，参数对齐上游 BASECFLAGS
          #   _CRYPTO_INTERNAL     自带 AES，不链接 openssl
          #   FULL_INTERNAL_DATA   把 15085 字节完整 KMS 数据编进去，运行时不需要 vlmcsd.kmd
          cd /tmp/vlmcsd-src/src
          "$CC" -Os -fno-strict-aliasing -fomit-frame-pointer \
            -ffunction-sections -fdata-sections -Wall \
            -D_CRYPTO_INTERNAL -DFULL_INTERNAL_DATA \
            -o /tmp/vlmcsd.out \
            vlmcsd.c kmsdata.c crypto.c crypto_internal.c kms.c endian.c \
            output.c shared_globals.c helpers.c network.c rpc.c \
            -Wl,--gc-sections -Wl,-s

          ls -l /tmp/vlmcsd.out
          file /tmp/vlmcsd.out

      - name: 校验 vlmcsd 二进制（ELF 目标 / KMS 数据内嵌）
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/build.log) 2>&1

          python3 - <<'PY'
          import struct

          b = open('/tmp/vlmcsd.out', 'rb').read()
          assert b[:4] == b'\x7fELF', 'not ELF'
          assert b[4] == 1, 'not ELF32'
          assert b[5] == 1, 'not little-endian'
          e_type, e_machine = struct.unpack_from('<HH', b, 16)
          assert e_type == 2, 'not executable'
          assert e_machine == 8, 'not MIPS'

          phoff, = struct.unpack_from('<I', b, 28)
          phentsize, phnum = struct.unpack_from('<HH', b, 42)
          interp = None
          for i in range(phnum):
              off = phoff + i * phentsize
              ptype, poff, _va, _pa, filesz = struct.unpack_from('<IIIII', b, off)
              if ptype == 3:
                  interp = b[poff:poff + filesz].rstrip(b'\0').decode()
          print('PT_INTERP =', interp)
          assert interp is None or 'musl' in interp, 'interpreter is not musl'

          head = bytes.fromhex('4b4d44000000020006010000030000001d000000ca0000000600000000000000')
          tail = bytes.fromhex('205374616e646172642032303139004f666669636520576f7264203230313900')
          assert head in b, 'KMS data head missing'
          assert tail in b, 'KMS data tail missing'
          print('size =', len(b), 'bytes, KMS data embedded')
          assert 40000 < len(b) < 300000, 'size abnormal'
          PY

          install -D -m755 /tmp/vlmcsd.out "${GITHUB_WORKSPACE}/files/usr/bin/vlmcsd"
          ls -l "${GITHUB_WORKSPACE}/files/usr/bin/vlmcsd"

      - name: 下载 ImageBuilder
        run: |
          set -euxo pipefail
          exec > >(tee -a /tmp/build.log) 2>&1
          IB="openwrt-imagebuilder-${OWRT_VER}-${TARGET}-${SUBTARGET}.Linux-x86_64"
          wget -q "https://downloads.openwrt.org/releases/${OWRT_VER}/targets/${TARGET}/${SUBTARGET}/${IB}.tar.zst"
          tar --zstd -xf "${IB}.tar.zst"
          echo "IB_DIR=${IB}" >> "$GITHUB_ENV"

      - name: 校验 profile
        run: |
          set -euxo pipefail
          exec > >(tee -a /tmp/build.log) 2>&1
          cd "$IB_DIR"
          make info > /tmp/info.txt 2>&1 || true
          if grep -q "$PROFILE" /tmp/info.txt; then
            echo "profile 存在: $PROFILE"
            grep -A3 "$PROFILE" /tmp/info.txt | head -5
          else
            echo "!! profile 不存在: $PROFILE"
            grep -i newifi /tmp/info.txt || sed -n '1,60p' /tmp/info.txt
            exit 1
          fi

      - name: 编译固件
        run: |
          set -euxo pipefail
          cd "$IB_DIR"
          # 用管道 tee，不要用 exec > >(tee)：进程替换里的 tee 在 step 结束会被
          # SIGTERM 打断，缓冲区直接丢，失败时什么都抓不到（踩过一次）。
          set +e
          make image \
            PROFILE="$PROFILE" \
            PACKAGES="$PKGS" \
            FILES="$GITHUB_WORKSPACE/files" 2>&1 | tee /tmp/image.log
          rc=${PIPESTATUS[0]}
          cat /tmp/image.log >> /tmp/build.log
          if [ "$rc" -ne 0 ]; then
            echo "!! make image 退出码 $rc"
            grep -iE 'error|not found|conflict|cannot|failed|Unknown package|unsatisfied' /tmp/image.log | tail -40
            exit "$rc"
          fi
          OUT="bin/targets/${TARGET}/${SUBTARGET}"
          echo "--- 产物 ---"
          ls -lh "$OUT"/*.bin
          sha256sum "$OUT"/*sysupgrade.bin | tee /tmp/sum.txt

      - name: 校验根文件系统内容与体积
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/build.log) 2>&1
          ROOT=$(find . -maxdepth 6 -type d -name 'root-ramips' | head -1)
          test -n "$ROOT"
          echo "ROOT=$ROOT"
          echo "--- 必须存在 ---"
          for p in usr/bin/vlmcsd etc/init.d/vlmcsd etc/init.d/proxy-mipsle \
                   etc/uci-defaults/99-newifi-custom usr/bin/curl \
                   usr/lib/lua/luci/i18n/base.zh-cn.lmo \
                   usr/lib/lua/luci/i18n/firewall.zh-cn.lmo \
                   www/luci-static/argon/css/cascade.css \
                   usr/share/ucode/luci/template/themes/argon/head.ut \
                   usr/share/ucode/luci/argon-palette.uc \
                   usr/share/ucode/luci/argon-branding.uc \
                   www/luci-static/resources/menu-argon.js \
                   www/luci-static/resources/argon-compat.js \
                   www/luci-static/resources/argon-appearance.js \
                   www/luci-static/resources/argon-overview.js \
                   www/luci-static/resources/argon-sshkeys.js \
                   www/luci-static/resources/argon-graphs.js \
                   usr/libexec/rpcd/luci.argon \
                   etc/init.d/sqm usr/lib/sqm/piece_of_cake.qos \
                   etc/init.d/sysntpd usr/sbin/ntpd \
                   usr/lib/sftp-server \
                   etc/config/vlmcsd \
                   www/luci-static/resources/view/vlmcsd/overview.js \
                   usr/share/luci/menu.d/luci-app-vlmcsd.json \
                   usr/share/rpcd/acl.d/luci-app-vlmcsd.json \
                   www/luci-static/resources/view/network/sqm.js \
                   usr/share/luci/menu.d/luci-app-sqm.json; do
            test -e "$ROOT/$p" && echo "OK   $p" || { echo "!! 缺 $p"; exit 1; }
          done
          # tc 是 alternatives 装到 /usr/libexec 的，按名字找更稳
          if find "$ROOT/usr/libexec" "$ROOT/sbin" -name 'tc*' | grep -q .; then
            echo "OK   tc ($(find "$ROOT/usr/libexec" "$ROOT/sbin" -name 'tc*' | head -1))"
          else
            echo "!! 缺 tc（SQM 干活要用）"; exit 1
          fi
          for m in sch_cake ifb; do
            if find "$ROOT/lib/modules" -name "${m}.ko" | grep -q .; then
              echo "OK   kmod $m"
            else
              echo "!! 缺 kmod $m"; exit 1
            fi
          done
          if test -e "$ROOT/etc/vlmcsd.kmd"; then echo "!! 多带了 vlmcsd.kmd"; exit 1; fi
          echo "OK   无 kmd（数据内嵌）"
          echo "--- 必须已剔除 ---"
          for p in etc/init.d/wpad usr/sbin/wpa_supplicant usr/sbin/hostapd; do
            if test -e "$ROOT/$p"; then echo "!! 还在: $p"; exit 1; else echo "GONE $p"; fi
          done
          if ls "$ROOT"/lib/modules/*/mt76* >/dev/null 2>&1; then echo "!! wifi 驱动还在"; exit 1; fi
          echo "GONE wifi 驱动"
          if ls "$ROOT"/lib/modules/*/ppp* >/dev/null 2>&1; then echo "!! ppp 还在"; exit 1; fi
          echo "GONE ppp"
          echo "--- 体积 ---"
          du -sh "$ROOT"
          du -sk "$ROOT"/* 2>/dev/null | sort -n | tail -12
          du -h --max-depth=2 "$ROOT/usr/lib" 2>/dev/null | sort -h | tail -8

      - name: 记录构建信息
        run: |
          OUT_DIR=$(ls -d openwrt-imagebuilder-*/bin/targets/ramips/mt7621)
          ROOT=$(find . -maxdepth 6 -type d -name 'root-ramips' | head -1)
          {
            echo "OpenWrt $OWRT_VER / $TARGET-$SUBTARGET / $PROFILE"
            echo
            echo "固件: $(ls -lh "$OUT_DIR"/*sysupgrade.bin | awk '{print $5"  "$9}')"
            echo "sha256: $(cut -d' ' -f1 /tmp/sum.txt 2>/dev/null)"
            echo "rootfs: $(du -sh "$ROOT" 2>/dev/null | cut -f1)"
            echo "vlmcsd: $(ls -lh files/usr/bin/vlmcsd | awk '{print $5}')"
            echo "包: $PKGS"
          } > /tmp/build-info.txt
          cat /tmp/build-info.txt

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: newifi-d2-sysupgrade
          path: |
            openwrt-imagebuilder-*/bin/targets/ramips/mt7621/*sysupgrade.bin
            /tmp/build-info.txt
          if-no-files-found: error
          retention-days: 30

      # 结果贴到 commit 评论：匿名打开 commit 页面就能看到构建结论和体积，不用来回问
      - name: 把结果贴到 commit 评论
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "构建结果：${{ job.status }} —— ${{ github.sha }}"
            echo
            echo '```'
            cat /tmp/build-info.txt 2>/dev/null || echo "(没有 build-info)"
            echo '```'
            if [ "${{ job.status }}" != "success" ]; then
              echo
              echo "失败日志（关键行 + 尾部）："
              echo '```'
              grep -inE 'error|not found|conflict|cannot|failed|Unknown package|unsatisfied|No such file' /tmp/build.log 2>/dev/null | tail -40 \
                || echo "(没匹配到关键字)"
              echo '--- 尾部 200 行 ---'
              tail -200 /tmp/build.log 2>/dev/null || echo "(没有 build.log)"
              echo '```'
            fi
          } > /tmp/comment.txt
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -F body=@/tmp/comment.txt && echo "评论已发" || echo "评论失败"
